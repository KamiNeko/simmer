[project]
name = "simmer"
version = "0.1.0"
description = "Self-hosted recipe manager"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.17",
    "pillow>=11.0",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "cryptography>=43",
    "anthropic>=1.15,<2",
    "openai>=3.35,<4",
    "google-genai>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.coverage.run]
source = ["app"]
branch = true
